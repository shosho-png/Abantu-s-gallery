<style>
:root{--bg:#fff;--bg2:#fafafa;--fg:#000;--fg2:#1a1a1a;--mid:#404040;--soft:#808080;--line:#e5e5e5;
--serif:'Instrument Serif',Georgia,'Times New Roman',serif;--sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--bg2:#1a1a1a;--fg:#fff;--fg2:#f5f5f5;--mid:#ccc;--soft:#808080;--line:#404040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--bg2:#1a1a1a;--fg:#fff;--fg2:#f5f5f5;--mid:#ccc;--soft:#808080;--line:#404040;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:1024px){.wrap{padding:0 32px}}
p{max-width:65ch;margin:0 0 16px;color:var(--mid)}
nav{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:12px;font:600 20px/1 var(--sans);letter-spacing:-.01em;text-decoration:none}
.mark{display:block;width:36px;height:36px;object-fit:contain}
nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0}
nav li a{font:550 14px/1 var(--sans);letter-spacing:.02em;text-decoration:none;padding:12px 0;display:inline-block;border-bottom:2px solid transparent}
nav li a:hover,nav li a.on{border-bottom-color:var(--fg)}
.back-btn{display:inline-flex;align-items:center;gap:8px;font:550 14px var(--sans);text-decoration:none;color:var(--mid);transition:color .3s ease-out}
.back-btn:hover{color:var(--fg)}
.project-hero{min-height:60svh;display:flex;flex-direction:column;justify-content:center;padding:calc(64px + 48px) 0 48px}
.project-hero h1{font:400 clamp(48px,8vw,96px)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 24px}
.project-hero .meta{font:550 18px var(--sans);color:var(--mid);margin-bottom:32px}
.project-hero .image{width:100%;max-width:800px;height:400px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 auto}
.project-hero .image img,.project-hero .image svg{width:100%;height:100%;object-fit:cover}
.project-content{padding:96px 0}
.project-content .description{font:400 20px/1.6 var(--sans);color:var(--fg2);max-width:75ch;margin-bottom:48px}
.project-content .details{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:48px}
.project-content .detail-item h3{font:550 16px var(--sans);margin:0 0 8px;color:var(--fg)}
.project-content .detail-item p{font:400 14px var(--sans);color:var(--mid);margin:0}
@media(max-width:800px){
.project-content .details{grid-template-columns:1fr;gap:24px}
.project-hero .image{height:280px}
}
</style>
</head>

<script>
(function(){
var P=[
{t:'Tracer Study',m:'Dissemination redesign',s:'Proposed prototype',k:'frames',b:'A new way to share Tracer Study findings with the people they describe.',x:'Tracer Study'},
{t:'PhotoVoice',m:'Participatory visual research',s:'Pilot concept',k:'blocks',b:'Participants photograph and caption their own context. The images become the public output.',x:'PhotoVoice'},
{t:'Sonic Ethnography',m:'Sound as analysis and output',s:'Pilot concept',k:'waves',b:'Field recordings and audio essays that carry research into spaces text cannot reach.',x:'Sonic Ethnography'},
{t:'Third Places',m:'Hybrid masculinity in South African rugby',s:'Early project',k:'rings',b:'Rugby as a "third place" between racial and national identities: how male players negotiate masculinity in the Rainbow Nation.',x:'Third Places'},
{t:'Public Dialogues',m:'Workshops and lectures',s:'Pilot concept',k:'net',b:'Open sessions on what science communication can do, in context, and where new clients meet us.',x:'Public Dialogues'}];

function art(k,seed){var r=function(){var a=seed;a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}(),o='';
if(k=='frames'){for(var i=0;i<4;i++)for(var j=0;j<5;j++){var x=24+i*92,y=24+j*92,f=r();o+='<rect x="'+x+'" y="'+y+'" width="80" height="80" fill="currentColor" fill-opacity="'+(f>.55?(.1+r()*.8).toFixed(2):0)+'" stroke="currentColor" stroke-width="1.5"/>';if(f<.35)o+='<rect x="'+(x+16)+'" y="'+(y+16)+'" width="48" height="48" fill="none" stroke="currentColor"/>'}}
if(k=='blocks'){for(var i=0;i<9;i++){var w=60+r()*220,x=24+r()*(352-w);o+='<rect x="'+x+'" y="'+(24+i*50)+'" width="'+w+'" height="'+(30+r()*14)+'" fill="currentColor" fill-opacity="'+(.15+r()*.8).toFixed(2)+'"/>'}}
if(k=='waves'){for(var i=0;i<40;i++){var h=14+Math.abs(Math.sin(i*.42)*150+Math.sin(i*1.3)*60)*(.5+r()*.5);o+='<rect x="'+(18+i*9.3)+'" y="'+(250-h)+'" width="4" height="'+h*2+'" rx="2" fill="currentColor"/>'}}
if(k=='rings'){for(var i=0;i<10;i++)o+='<circle cx="'+(200+(r()-.5)*36)+'" cy="'+(250+(r()-.5)*36)+'" r="'+(18+i*20)+'" fill="none" stroke="currentColor" stroke-width="'+(i%3?1:2)+'" '+(i%2?'stroke-dasharray="3 6"':'')+'/>'}
if(k=='net'){var q=[];for(var i=0;i<16;i++)q.push([40+r()*320,40+r()*420]);q.forEach(function(a,i){q.forEach(function(b,j){if(j>i&&Math.hypot(a[0]-b[0],a[1]-b[1])<130)o+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="currentColor" stroke-opacity=".5"/>'})});q.forEach(function(a){o+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="'+(4+r()*8)+'" fill="currentColor"/>'})}
return '<svg viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+o+'</svg>'}

var urlParams=new URLSearchParams(window.location.search);
var projectId=urlParams.get('id');
var project=P[projectId];

if(project){
document.getElementById('projectTitle').textContent=project.t;
document.getElementById('projectMeta').textContent=project.m+' · '+project.s;
document.getElementById('projectDescription').textContent=project.b;
document.getElementById('projectMethodology').textContent=project.m;
document.getElementById('projectStatus').textContent=project.s;
document.getElementById('projectImage').innerHTML=project.img?'<img src="'+project.img+'" alt="'+project.alt+'">':art(project.k,parseInt(projectId)+1);
document.title=project.t+' - Abantu\'s Gallery';
}else{
document.getElementById('projectTitle').textContent='Project not found';
document.getElementById('projectDescription').textContent='Please return to the projects page and select a valid project.';
}
})();
</script>
